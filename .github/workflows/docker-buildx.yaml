name: Docker Buildx

on:
  workflow_call:
    inputs:
      registry:
        required: false
        type: string
        default: ghcr.io

      registry_owner:
        required: false
        type: string
        default: balutoiu

      image_name:
        required: true
        type: string

      image_tag:
        required: false
        type: string

      context:
        required: true
        type: string

      platforms:
        required: true
        type: string

      build_args:
        required: false
        type: string

      push:
        required: false
        type: boolean
        default: true

      runs_on:
        required: false
        type: string
        default: ubuntu-latest

      keep_images:
        description: The newest images of any tag that the registry cleanup keeps
        required: false
        type: number
        default: 3

      keep_releases:
        description: The newest images with a release tag that the registry cleanup keeps
        required: false
        type: number
        default: 3

      release_tags:
        description: The regex of a release tag
        required: false
        type: string
        default: '^v?[0-9]+\.[0-9]+\.[0-9]+$'

    secrets:
      registry_password:
        required: false

jobs:
  docker-buildx:
    runs-on: ${{ inputs.runs_on }}

    steps:
      - name: Checkout
        # v7.0.0; SHA: gh api repos/actions/checkout/commits/v7.0.0 --jq .sha
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: Set up QEMU
        # v4.2.0; SHA: gh api repos/docker/setup-qemu-action/commits/v4.2.0 --jq .sha
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8

      - name: Set up Docker Buildx
        # v4.2.0; SHA: gh api repos/docker/setup-buildx-action/commits/v4.2.0 --jq .sha
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c

      - name: Login to Container Registry
        if: ${{ inputs.push }}
        # v4.4.0; SHA: gh api repos/docker/login-action/commits/v4.4.0 --jq .sha
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0
        with:
          registry: ${{ inputs.registry }}
          username: ${{ inputs.registry_owner }}
          password: ${{ secrets.registry_password || secrets.GITHUB_TOKEN }}

      - name: Set the image tag environment variable
        if: inputs.image_tag == '' && github.ref_type == 'tag'
        run: echo "IMAGE_TAG=$(echo ${{ github.ref_name }} | sed "s/^${{ inputs.image_name }}-//")" >> $GITHUB_ENV

      - name: Docker meta
        id: meta
        # v6.2.0; SHA: gh api repos/docker/metadata-action/commits/v6.2.0 --jq .sha
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302
        with:
          images: ${{ inputs.registry }}/${{ inputs.registry_owner }}/${{ inputs.image_name }}
          tags: |
            ${{ github.sha }}
            ${{ inputs.image_tag != '' && inputs.image_tag || env.IMAGE_TAG }}

      - name: Build and push
        # v7.3.0; SHA: gh api repos/docker/build-push-action/commits/v7.3.0 --jq .sha
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
        with:
          platforms: ${{ inputs.platforms }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          context: ${{ inputs.context }}
          build-args: ${{ inputs.build_args }}
          pull: true
          push: ${{ inputs.push }}

      - name: Cleanup registry
        # A multi-arch build pushes an index, one untagged image per platform and one untagged attestation per
        # platform, all versions of the package. Pruning by version count deletes the tags the clusters run, and
        # pruning untagged versions breaks every multi-arch tag, so this keeps whole images, children included.
        if: ${{ inputs.push }}
        # v9.0.0; SHA: gh api repos/actions/github-script/commits/v9.0.0 --jq .sha
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        env:
          REGISTRY: ${{ inputs.registry }}
          OWNER: ${{ inputs.registry_owner }}
          IMAGE: ${{ inputs.image_name }}
          KEEP_IMAGES: ${{ inputs.keep_images }}
          KEEP_RELEASES: ${{ inputs.keep_releases }}
          RELEASE_TAGS: ${{ inputs.release_tags }}
        with:
          script: |
            const {REGISTRY, OWNER, IMAGE} = process.env
            const pkg = {package_type: 'container', package_name: IMAGE, username: OWNER}
            const versions = await github.paginate(github.rest.packages.getAllPackageVersionsForPackageOwnedByUser, {...pkg, per_page: 100})
            const tags = v => v.metadata?.container?.tags ?? []
            const release = new RegExp(process.env.RELEASE_TAGS)
            const tagged = versions.filter(v => tags(v).length > 0).sort((a, b) => Date.parse(b.created_at) - Date.parse(a.created_at))
            const roots = new Set([
              ...tagged.slice(0, Number(process.env.KEEP_IMAGES)),
              ...tagged.filter(v => tags(v).some(t => release.test(t))).slice(0, Number(process.env.KEEP_RELEASES)),
            ])
            const keep = new Set()
            for (const v of roots) {
              keep.add(v.name)
              const ref = `${REGISTRY}/${OWNER}/${IMAGE}@${v.name}`
              const out = await exec.getExecOutput('docker', ['buildx', 'imagetools', 'inspect', '--raw', ref], {ignoreReturnCode: true, silent: true})
              if (out.exitCode !== 0) {
                core.warning(`Cleanup skipped: can't read ${ref} (${tags(v).join(', ')}): ${out.stderr.trim()}`)
                return
              }
              for (const m of JSON.parse(out.stdout).manifests ?? []) keep.add(m.digest)
              core.info(`keep ${tags(v).join(', ')}`)
            }
            // A build running beside this one has pushed its platform images but maybe not yet its tagged index.
            const settled = Date.now() - 60 * 60 * 1000
            for (const v of versions.filter(v => !keep.has(v.name) && Date.parse(v.created_at) < settled)) {
              core.info(`delete ${v.name} ${tags(v).join(', ') || '(untagged)'} from ${v.created_at}`)
              await github.rest.packages.deletePackageVersionForUser({...pkg, package_version_id: v.id})
            }
