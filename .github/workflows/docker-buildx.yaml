name: Docker Buildx

on:
  workflow_call:
    inputs:
      registry:
        required: false
        type: string
        default: ghcr.io

      registry_owner:
        required: false
        type: string
        default: balutoiu

      image_name:
        required: true
        type: string

      image_tag:
        required: false
        type: string

      context:
        required: true
        type: string

      platforms:
        required: true
        type: string

      build_args:
        required: false
        type: string

      push:
        required: false
        type: boolean
        default: true

      runs_on:
        required: false
        type: string
        default: ubuntu-latest

    secrets:
      registry_password:
        required: false

jobs:
  docker-buildx:
    runs-on: ${{ inputs.runs_on }}

    steps:
      - name: Checkout
        # v7.0.0; SHA: gh api repos/actions/checkout/commits/v7.0.0 --jq .sha
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: Set up QEMU
        # v4.2.0; SHA: gh api repos/docker/setup-qemu-action/commits/v4.2.0 --jq .sha
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8

      - name: Set up Docker Buildx
        # v4.2.0; SHA: gh api repos/docker/setup-buildx-action/commits/v4.2.0 --jq .sha
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c

      - name: Login to Container Registry
        if: ${{ inputs.push }}
        # v4.4.0; SHA: gh api repos/docker/login-action/commits/v4.4.0 --jq .sha
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0
        with:
          registry: ${{ inputs.registry }}
          username: ${{ inputs.registry_owner }}
          password: ${{ secrets.registry_password || secrets.GITHUB_TOKEN }}

      - name: Set the image tag environment variable
        if: inputs.image_tag == '' && github.ref_type == 'tag'
        run: echo "IMAGE_TAG=$(echo ${{ github.ref_name }} | sed "s/^${{ inputs.image_name }}-//")" >> $GITHUB_ENV

      - name: Docker meta
        id: meta
        # v6.2.0; SHA: gh api repos/docker/metadata-action/commits/v6.2.0 --jq .sha
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302
        with:
          images: ${{ inputs.registry }}/${{ inputs.registry_owner }}/${{ inputs.image_name }}
          tags: |
            ${{ github.sha }}
            ${{ inputs.image_tag != '' && inputs.image_tag || env.IMAGE_TAG }}

      - name: Build and push
        # v7.3.0; SHA: gh api repos/docker/build-push-action/commits/v7.3.0 --jq .sha
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
        with:
          platforms: ${{ inputs.platforms }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          context: ${{ inputs.context }}
          build-args: ${{ inputs.build_args }}
          pull: true
          push: ${{ inputs.push }}

      - name: Cleanup registry
        # v5.0.0; SHA: gh api repos/actions/delete-package-versions/commits/v5.0.0 --jq .sha
        uses: actions/delete-package-versions@e5bc658cc4c965c472efe991f8beea3981499c55
        with:
          package-name: ${{ inputs.image_name }}
          package-type: container
          min-versions-to-keep: 5
